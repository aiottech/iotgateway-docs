name: Deploy Docusaurus & Generate PDF Manual

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Build Site, Export PDF & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Website
        run: npm run build

      - name: Generate PDF User Manual
        run: |
          npx docusaurus serve --port 3000 --no-open &
          SERVER_PID=$!
          node scripts/generate_pdf.mjs
          kill $SERVER_PID || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true

      - name: Publish PDF to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-manual
          name: "MGW Official User Manual (Latest PDF)"
          body: "Automated PDF export compiled from the CONSTH MGW Developer Portal."
          files: build/pdf/MGW_User_Manual.pdf
          make_latest: true